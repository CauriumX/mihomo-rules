name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每 6 小时兜底检查（与 mihomo-upstream 的快照 cron 错开 30 分钟）。
    # 即便上游未配置 dispatch token，这一条也能让「上游规则变化 / 新增类目」自动被发现。
    - cron: '30 */6 * * *'
  repository_dispatch:
    # 上游快照仓发布后主动触发（可选加速；未配 PAT 时依赖上面的 schedule）。
    types: [snapshot-published]

permissions:
  contents: read
  issues: write

jobs:
  version-and-rules:
    name: Version train + ruleset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Release-train guard: package.json.version === CHANGELOG === README badges.
      - name: Version coherence
        run: node tools/version-check.mjs .

      # AGENTS.md is generated by Readme Harness and read automatically by AI
      # agents at the start of every session. Its Version and CI fields drift
      # silently once nobody re-runs the generator: on 2026-11-11 it still said
      # version 0.1.0 and `CI: none` while the repo had 14 CI steps. An agent
      # reading that skips CI entirely and reasons from a stale version.
      - name: AGENTS.md not drifted
        run: node tools/check-agents-md.mjs .

      # Doc source references (file:line) must still point at the right code.
      #
      # Line numbers are the most silently-rotting thing in a doc: a wrong
      # business number gets noticed, a wrong line number never does. On
      # 2026-11-11 two docs carried 5 stale mihomo ranges — the worst was off
      # by 85 lines (ParseProxyGroup ends at L185, docs said L48-100).
      # A reader following that lands on unrelated code and believes it was
      # verified.
      #
      # tools/doc-refs.json holds every reference as an executable assertion.
      # External sources are shallow-cloned at the pinned tag.
      - name: Doc source references valid
        run: node tools/check-doc-refs.mjs --fetch

      # Unit tests (sync-nodes, render-check, check-node-names, check-agents-md,
      # check-doc-refs).
      - name: Unit tests
        run: npm test

      # Python tests: filter rules, conflict detection.
      - name: Python tests
        run: |
          pip install --quiet pytest pyyaml
          python3 -m pytest tests/ -q

      # Ruleset artefacts must be committed — clients fetch them at runtime.
      - name: Ruleset artefacts present
        run: |
          missing=0
          for f in ruleset/Crypto.txt ruleset/PayPal.txt \
                   ruleset/geoip/China-IP.mrs ruleset/geoip/Local-IP.mrs \
                   ruleset/geoip/Telegram-IP.mrs; do
            if [ ! -s "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          n=$(find ruleset/site -name '*.mrs' -size +0 2>/dev/null | wc -l)
          if [ "$n" -lt 19 ]; then echo "expected 19 site rulesets, found $n"; missing=1; fi
          exit $missing

      # PayPal phishing entries must never include an official domain.
      #
      # Uses the full keep list from filters/paypal.yaml — the old hardcoded
      # 10-domain set missed every other official domain in the list.
      - name: Phishing list safety
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml

          spec = yaml.safe_load(open('filters/paypal.yaml', encoding='utf-8'))
          official = {e['domain'].lower() for e in spec.get('keep') or []}

          entries = set()
          for line in open('ruleset/PayPal-Phish.txt', encoding='utf-8'):
              line = line.strip()
              if line and not line.startswith('#') and ',' in line:
                  entries.add(line.split(',')[1].lower())

          leaked = entries & official
          if leaked:
              sys.exit(f'official domains in phishing list: {sorted(leaked)}')
          print(f'OK: {len(entries)} phishing entries, none of the {len(official)} official domains')
          PY

      # The filter rule file must be self-consistent.
      # Catches keep / pattern_reject conflicts — the class of bug that let
      # ppaypal.com route through the proxy group instead of being rejected.
      - name: Filter rules consistent
        run: |
          pip install --quiet pyyaml
          python3 filter-paypal-phish.py --check

      # Rule-set overlaps must be declared in ruleset/precedence.yaml.
      # Undeclared overlap means one ruleset silently shadows another.
      - name: Rule-set overlaps declared
        run: |
          pip install --quiet pyyaml
          curl -sSL -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz"
          gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo
          PATH="/tmp:$PATH" python3 tools/check-overlap.py

      # sing-box 规则集（.srs）：与 .mrs 同源。
      #
      # mrs 是 mihomo 私有格式，sing-box 只吃 srs。两套产物必须来自同一次构建，
      # 否则会出现「mrs 更新了、srs 忘了更新」而无人察觉。
      - name: sing-box rulesets (.srs) regenerate and match
        run: |
          set -euo pipefail

          SINGBOX_VERSION=1.14.4
          curl -sSL -o /tmp/sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar xzf /tmp/sb.tar.gz -C /tmp
          export SINGBOX_BIN="/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box"
          "$SINGBOX_BIN" version

          curl -sSL -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz"
          gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo
          export PATH="/tmp:$PATH"

          # 重建到临时目录后与已提交产物比对
          mkdir -p /tmp/nosnap
          # singbox 只解码已有 .mrs，不访问上游；SNAPSHOT_DIR 仅用于满足脚本启动时的环境检查
          DEST_OVERRIDE=/tmp/srscheck SNAPSHOT_DIR=/tmp/nosnap SINGBOX_BIN="$SINGBOX_BIN" bash build-rules.sh singbox
          missing=0
          for f in /tmp/srscheck/singbox/site/*.srs /tmp/srscheck/singbox/geoip/*.srs /tmp/srscheck/singbox/*.srs; do
            rel="${f#/tmp/srscheck/}"
            if [ ! -s "ruleset/$rel" ]; then
              echo "::error::缺少已提交的 ruleset/$rel（本地没跑 build-rules.sh singbox ?）"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "  OK  $(find /tmp/srscheck/singbox -name '*.srs' | wc -l) 个 .srs 与仓库一致"

      # Shadowrocket / Surge 规则集（.list）：与 mrs 同源，纯文本。
      - name: surfboard/shadowrocket rule lists (.list) present
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz"
          gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo
          export PATH="/tmp:$PATH"

          mkdir -p /tmp/nosnap
          DEST_OVERRIDE=/tmp/listcheck SNAPSHOT_DIR=/tmp/nosnap bash build-rules.sh list
          missing=0
          for f in /tmp/listcheck/list/site/*.list /tmp/listcheck/list/geoip/*.list /tmp/listcheck/list/*.list; do
            rel="${f#/tmp/listcheck/}"
            [ -s "ruleset/$rel" ] || { echo "::error::缺少已提交的 ruleset/$rel"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

          # 纯文本格式必须是 Surge 那套（DOMAIN,/DOMAIN-SUFFIX,/IP-CIDR…），
          # 不能混进 mihomo 语法（+. 前缀）或二进制
          # 用 awk 而不是 grep：干净产物上 grep 无匹配返回 1，配合 pipefail + set -e
          # 会把整个步骤判失败（本步第一次上线就是这么红的，而产物其实是对的）。
          bad=$(awk '/^\+\./ { n++ } END { print n+0 }' ruleset/list/site/*.list 2>/dev/null || echo 0)
          if [ "$bad" -ne 0 ]; then
            echo "::error::list 里出现了 mihomo 风格前缀（+.），应为 DOMAIN-SUFFIX,";
            exit 1
          fi
          echo "  OK  $(find ruleset/list -name '*.list' | wc -l) 个 .list 与仓库一致"

      # 从私有仓下载最新快照，跑一次完整构建，验证产物可复现。
      #
      # 这一步是 CI 的核心价值：证明「给定快照 → 产物」这条链路是通的，
      # 而不是只验证已提交的产物形状对不对。
      #
      # 需要 UPSTREAM_READ_TOKEN：fine-grained PAT，仅 mihomo-upstream 的
      # contents:read。缺这个 secret 时跳过（fork / 本地跑不会红）。
      #
      # 检测到上游变化（check 退出码非 0，或快照标注了新增类目）时，
      # 自动开/更新一个 issue 作为提醒 —— 光让 CI 变红没人看 Actions 页。
      - name: Build from upstream snapshot
        id: upstream
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${UPSTREAM_TOKEN:-}" ]; then
            echo "SKIP: UPSTREAM_READ_TOKEN 未配置，跳过快照构建"
            exit 0
          fi

          # check 模式需要 mihomo 解码 .mrs 并与现有产物比对
          curl -sSL -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz"
          gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo
          export PATH="/tmp:$PATH"

          mkdir -p upstream
          export GH_TOKEN="$UPSTREAM_TOKEN"
          gh release download \
            --repo CauriumX/mihomo-upstream \
            --pattern 'snapshots.tar.gz' \
            --dir upstream/ 2>/dev/null || {
              echo "SKIP: 私有仓暂无快照 Release"
              exit 0
            }
          # 新增类目变更清单（mihomo-upstream 的 probe 产出；旧快照可能没有）
          gh release download \
            --repo CauriumX/mihomo-upstream \
            --pattern 'inventory-changes.json' \
            --dir upstream/ --clobber 2>/dev/null || true

          tar xzf upstream/snapshots.tar.gz -C upstream/

          # 快照解包后是 a/ b/ c/ 三个目录，对应三个上游。
          # 构建脚本按环境变量寻址，这里把快照路径喂进去。
          export SNAPSHOT_DIR="$PWD/upstream"

          # 用快照内容替代网络拉取：build-rules.sh 支持从本地读取
          # （未实现时退化为跳过，不阻断 CI）
          if ! grep -q 'SNAPSHOT_DIR' build-rules.sh; then
            echo "SKIP: build-rules.sh 尚未支持 SNAPSHOT_DIR"
            exit 0
          fi

          # 捕获 check 结果，不让 set -e 直接中断
          set +e
          bash build-rules.sh check
          rc=$?

          # 从 inventory-changes.json 提取新增类目（若上游 probe 产出了该文件）
          newcats=""
          if [ -f upstream/inventory-changes.json ]; then
            newcats=$(jq -r '((.added.upstreamA // []) + (.added.sakura // [])) | join(", ")' \
                       upstream/inventory-changes.json 2>/dev/null || true)
          fi

          if [ "$rc" -ne 0 ] || [ -n "$newcats" ]; then
            echo "::warning::检测到上游变更（check rc=$rc, 新增类目=${newcats:-无}）"
            export GH_TOKEN="$REPO_TOKEN"
            TITLE="[auto] 上游规则变更待发布"
            BODY=$(printf '%s\n' \
              "mihomo-rules 定时/触发检查发现上游有变动，需要走 check→apply→发布。" \
              "" \
              "- check 退出码: \`$rc\`（0=无变化, 1=warn>5%, 2=BLOCK>30%）" \
              "- 新增类目: \`${newcats:-无}\`" \
              "- 触发方式: \`${GITHUB_EVENT_NAME}\`" \
              "" \
              "## 变更摘要（review/decisions.jsonl 末尾）" \
              '```' \
              "$(tail -20 review/decisions.jsonl 2>/dev/null || echo '(无)')" \
              '```' \
              "" \
              "处理：\`SNAPSHOT_DIR=<快照> bash build-rules.sh apply\` → 提交 → mihomo-apply 发版。")
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                         --search '上游规则变更待发布 in:title' \
                         --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$BODY" || true
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" || true
            fi
          else
            echo "上游无变更"
          fi

          # 已通过 issue 提醒，退出码保持 0，避免每 6 小时一次的红叉噪音
          exit 0

      # 审核日志归档。
      #
      # diff_report() 每次都会把变更写进 review/decisions.jsonl，但该目录
      # 已 gitignore，CI 跑完就随 runner 销毁 —— 半年后问「AD-Site 为什么是
      # 316,103 条」只能翻 commit 猜。
      #
      # 这里把它作为 artifact 留存。用 always() 是必须的：build-rules.sh check
      # 在有差异时返回非零（rc=1），BLOCK 时返回其它非零码，那些恰恰是最需要
      # 留下决策记录的运行。不加 always() 就只会在「一切正常」时才归档。
      - name: Upload review log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: review-decisions
          path: review/decisions.jsonl
          if-no-files-found: ignore
          retention-days: 90
