name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  version-and-rules:
    name: Version train + ruleset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Release-train guard: package.json.version === CHANGELOG === README badges.
      - name: Version coherence
        run: node tools/version-check.mjs .

      # AGENTS.md is generated by Readme Harness and read automatically by AI
      # agents at the start of every session. Its Version and CI fields drift
      # silently once nobody re-runs the generator: on 2026-11-11 it still said
      # version 0.1.0 and `CI: none` while the repo had 14 CI steps. An agent
      # reading that skips CI entirely and reasons from a stale version.
      - name: AGENTS.md not drifted
        run: node tools/check-agents-md.mjs .

      # Doc source references (file:line) must still point at the right code.
      #
      # Line numbers are the most silently-rotting thing in a doc: a wrong
      # business number gets noticed, a wrong line number never does. On
      # 2026-11-11 two docs carried 5 stale mihomo ranges — the worst was off
      # by 85 lines (ParseProxyGroup ends at L185, docs said L48-100).
      # A reader following that lands on unrelated code and believes it was
      # verified.
      #
      # tools/doc-refs.json holds every reference as an executable assertion.
      # External sources are shallow-cloned at the pinned tag.
      - name: Doc source references valid
        run: node tools/check-doc-refs.mjs --fetch

      # 模板与规则集的版本契约 —— 防止「模板锁 commit、规则集漂 @main」
      - name: Template/ruleset version contract
        run: node tools/check-version-contract.mjs

      # Badge row audit — fails if a README badge row drifts from the standard.
      - name: Badge row audit
        run: node module/badges-google/google-badges.mjs .

      # Unit tests (sync-nodes, render-check, check-node-names, check-agents-md,
      # check-doc-refs).
      - name: Unit tests
        run: npm test

      # Python tests: filter rules, conflict detection.
      - name: Python tests
        run: |
          pip install --quiet pytest pyyaml
          python3 -m pytest tests/ -q

      # Ruleset artefacts must be committed — clients fetch them at runtime.
      - name: Ruleset artefacts present
        run: |
          missing=0
          for f in ruleset/Crypto.txt ruleset/PayPal.txt \
                   ruleset/geoip/China-IP.mrs ruleset/geoip/Local-IP.mrs \
                   ruleset/geoip/Telegram-IP.mrs; do
            if [ ! -s "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          n=$(find ruleset/site -name '*.mrs' -size +0 2>/dev/null | wc -l)
          if [ "$n" -lt 19 ]; then echo "expected 19 site rulesets, found $n"; missing=1; fi
          exit $missing

      # PayPal phishing entries must never include an official domain.
      #
      # Uses the full keep list from filters/paypal.yaml — the old hardcoded
      # 10-domain set missed every other official domain in the list.
      - name: Phishing list safety
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml

          spec = yaml.safe_load(open('filters/paypal.yaml', encoding='utf-8'))
          official = {e['domain'].lower() for e in spec.get('keep') or []}

          entries = set()
          for line in open('ruleset/PayPal-Phish.txt', encoding='utf-8'):
              line = line.strip()
              if line and not line.startswith('#') and ',' in line:
                  entries.add(line.split(',')[1].lower())

          leaked = entries & official
          if leaked:
              sys.exit(f'official domains in phishing list: {sorted(leaked)}')
          print(f'OK: {len(entries)} phishing entries, none of the {len(official)} official domains')
          PY

      # The filter rule file must be self-consistent.
      # Catches keep / pattern_reject conflicts — the class of bug that let
      # ppaypal.com route through the proxy group instead of being rejected.
      - name: Filter rules consistent
        run: |
          pip install --quiet pyyaml
          python3 filter-paypal-phish.py --check

      # Rule-set overlaps must be declared in ruleset/precedence.yaml.
      # Undeclared overlap means one ruleset silently shadows another.
      - name: Rule-set overlaps declared
        run: |
          pip install --quiet pyyaml
          curl -sSL -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz"
          gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo
          PATH="/tmp:$PATH" python3 tools/check-overlap.py

      # 从私有仓下载最新快照，跑一次完整构建，验证产物可复现。
      #
      # 这一步是 CI 的核心价值：证明「给定快照 → 产物」这条链路是通的，
      # 而不是只验证已提交的产物形状对不对。
      #
      # 需要 UPSTREAM_READ_TOKEN：fine-grained PAT，仅 mihomo-upstream 的
      # contents:read。缺这个 secret 时跳过（fork / 本地跑不会红）。
      - name: Build from upstream snapshot
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SKIP: UPSTREAM_READ_TOKEN 未配置，跳过快照构建"
            exit 0
          fi

          mkdir -p upstream
          gh release download \
            --repo CauriumX/mihomo-upstream \
            --pattern 'snapshots.tar.gz' \
            --dir upstream/ 2>/dev/null || {
              echo "SKIP: 私有仓暂无快照 Release"
              exit 0
            }

          tar xzf upstream/snapshots.tar.gz -C upstream/

          # 快照解包后是 a/ b/ c/ 三个目录，对应三个上游。
          # 构建脚本按环境变量寻址，这里把快照路径喂进去。
          export SNAPSHOT_DIR="$PWD/upstream"

          # 用快照内容替代网络拉取：build-rules.sh 支持从本地读取
          # （未实现时退化为跳过，不阻断 CI）
          if ! grep -q 'SNAPSHOT_DIR' build-rules.sh; then
            echo "SKIP: build-rules.sh 尚未支持 SNAPSHOT_DIR"
            exit 0
          fi

          bash build-rules.sh check
